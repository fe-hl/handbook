<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="FE Handbook">
  <defs>
    <linearGradient id="feBrand" x1="8" y1="4" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5bd79b" />
      <stop offset="0.5" stop-color="#3eaf7c" />
      <stop offset="1" stop-color="#178f5f" />
    </linearGradient>
    <linearGradient id="feBrandSoft" x1="10" y1="32" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fc08d" stop-opacity="0.26" />
      <stop offset="1" stop-color="#178f5f" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="feCore" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b9f3d6" />
      <stop offset="0.5" stop-color="#4fc08d" />
      <stop offset="1" stop-color="#178f5f" />
    </radialGradient>
    <radialGradient id="feHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#4fc08d" stop-opacity="0.32" />
      <stop offset="1" stop-color="#4fc08d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- halo -->
  <circle cx="32" cy="13" r="12.4" fill="url(#feHalo)" />

  <!-- neural links rising from the book -->
  <g stroke="url(#feBrand)" stroke-width="2.2" stroke-linecap="round">
    <path d="M32 36.5 L22.5 29.5" />
    <path d="M32 36.5 L41.5 29.5" />
    <path d="M22.5 29.5 L14.5 21" />
    <path d="M41.5 29.5 L49.5 21" />
    <path d="M14.5 21 L32 13" />
    <path d="M49.5 21 L32 13" />
    <path d="M22.5 29.5 L41.5 29.5" opacity="0.4" />
    <path d="M14.5 21 L49.5 21" opacity="0.28" />
  </g>

  <!-- neurons -->
  <g fill="url(#feBrand)">
    <circle cx="14.5" cy="21" r="3.4" />
    <circle cx="49.5" cy="21" r="3.4" />
    <circle cx="22.5" cy="29.5" r="2.6" />
    <circle cx="41.5" cy="29.5" r="2.6" />
  </g>
  <circle cx="32" cy="13" r="6" fill="url(#feCore)" stroke="#178f5f" stroke-width="1" stroke-opacity="0.35" />

  <!-- open handbook -->
  <path d="M31 39.5C25.5 35 16.5 34 8.5 35.2V51.4C16.5 50.2 25.5 51.6 31 56Z" fill="url(#feBrandSoft)" stroke="url(#feBrand)" stroke-width="2.8" stroke-linejoin="round" />
  <path d="M33 39.5C38.5 35 47.5 34 55.5 35.2V51.4C47.5 50.2 38.5 51.6 33 56Z" fill="url(#feBrandSoft)" stroke="url(#feBrand)" stroke-width="2.8" stroke-linejoin="round" />
  <path d="M32 38.8V56.6" stroke="url(#feBrand)" stroke-width="2.6" stroke-linecap="round" />
</svg>